{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-5" style="width: 100%; max-width: 500px; border-radius: 15px; border: none; text-align: center;">
        
        <div class="mb-4">
            <span style="font-size: 3rem;">🔐</span>
            <h2 class="fw-bold mt-3" style="color: #333;">Verification</h2>
            <p class="text-muted">We sent a 6-digit code to your email.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <input type="text" name="otp" class="form-control form-control-lg text-center" 
                       placeholder="1 2 3 4 5 6" maxlength="6" 
                       style="font-size: 1.5rem; letter-spacing: 5px;" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold" style="font-size: 1.1rem; border-radius: 8px;">
                Verify & Login
            </button>
        </form>

        <div class="mt-4">
            <p class="small text-muted">Didn't receive the code?</p>
            <a href="{% url 'request_otp' %}" class="btn btn-sm btn-outline-warning text-dark fw-bold">Resend OTP</a>
        </div>

    </div>
</div>
{% endblock %}
