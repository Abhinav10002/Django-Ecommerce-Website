{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 450px; border-radius: 15px; border: none;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: #333;">Welcome Back</h2>
            <p class="text-muted">Please login to your account</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" required style="font-size: 1rem;">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required style="font-size: 1rem;">
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold" style="font-size: 1.1rem; border-radius: 8px;">
                Login
            </button>
        </form>

        <div class="my-3 text-center text-muted">
            <small>OR</small>
        </div>

        <a href="{% url 'request_otp' %}" class="btn btn-outline-warning w-100 py-2 fw-bold text-dark" style="border-radius: 8px;">
    Login with OTP 📱
</a>

        <div class="text-center mt-4">
            <p class="small text-muted">
                Don't have an account? 
                <a href="{% url 'register' %}" class="text-warning fw-bold text-decoration-none">Sign Up</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
